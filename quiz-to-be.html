<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Verbo To Be</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #2c3b2f;
    --board-dark: #223026;
    --chalk: #eee9dc;
    --chalk-yellow: #e8c468;
    --chalk-pink: #e28b9c;
    --chalk-blue: #8bb4c9;
    --chalk-faint: rgba(238,233,220,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.03), transparent 40%),
      var(--board);
    background-blend-mode: normal;
    font-family:'Patrick Hand', sans-serif;
    color:var(--chalk);
    display:flex;
    justify-content:center;
    padding:40px 16px 80px;
  }
  /* chalk dust texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.15) 0, transparent 100%),
      radial-gradient(1px 1px at 80% 40%, rgba(255,255,255,0.1) 0, transparent 100%),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.12) 0, transparent 100%),
      radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.1) 0, transparent 100%);
    background-size: 300px 300px, 250px 250px, 280px 280px, 220px 220px;
    opacity:0.6;
  }
  .frame{
    width:100%;
    max-width:680px;
  }
  .eyebrow{
    font-family:'Kalam', cursive;
    color:var(--chalk-yellow);
    font-size:1.05rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-bottom:2px dashed var(--chalk-faint);
    display:inline-block;
    padding-bottom:4px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:clamp(2.1rem, 6vw, 3rem);
    margin:0 0 6px;
    line-height:1.05;
    text-shadow: 0 0 1px rgba(238,233,220,0.4);
  }
  .sub{
    font-size:1.15rem;
    color:var(--chalk-faint);
    margin:0 0 28px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:28px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:rgba(238,233,220,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--chalk-yellow);
    transition:width .35s ease;
  }
  #progressLabel{
    font-family:'Kalam',cursive;
    font-size:1.1rem;
    white-space:nowrap;
    color:var(--chalk-yellow);
  }
  .card{
    border:2px solid rgba(238,233,220,0.5);
    border-radius:10px;
    padding:28px 24px;
    margin-bottom:18px;
    position:relative;
    background:rgba(255,255,255,0.02);
  }
  .qnum{
    font-family:'Kalam',cursive;
    color:var(--chalk-blue);
    font-size:1.1rem;
    margin-bottom:10px;
    display:block;
  }
  .qtext{
    font-size:1.5rem;
    line-height:1.35;
    margin:0 0 20px;
  }
  .qtext em{
    color:var(--chalk-yellow);
    font-style:normal;
    border-bottom:2px solid var(--chalk-yellow);
  }
  .options{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .opt-btn{
    flex:1;
    min-width:130px;
    font-family:'Kalam',cursive;
    font-size:1.25rem;
    font-weight:700;
    padding:14px 10px;
    border-radius:8px;
    border:2px solid var(--chalk-faint);
    background:transparent;
    color:var(--chalk);
    cursor:pointer;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .opt-btn:hover{
    border-color:var(--chalk);
    transform:translateY(-2px);
  }
  .opt-btn:focus-visible{
    outline:3px solid var(--chalk-yellow);
    outline-offset:2px;
  }
  .opt-btn.correct{
    background:rgba(139,196,148,0.18);
    border-color:#8bc494;
    color:#c8e9cc;
  }
  .opt-btn.wrong{
    background:rgba(226,139,156,0.18);
    border-color:var(--chalk-pink);
    color:#f3c3cd;
  }
  .opt-btn:disabled{
    cursor:default;
    transform:none;
  }
  .feedback{
    margin-top:14px;
    font-size:1.1rem;
    min-height:1.4em;
    font-family:'Kalam',cursive;
  }
  .feedback.ok{color:#9bd6a4;}
  .feedback.no{color:var(--chalk-pink);}
  .nav-row{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
  }
  .next-btn{
    font-family:'Kalam',cursive;
    font-size:1.15rem;
    background:var(--chalk-yellow);
    color:var(--board-dark);
    border:none;
    border-radius:8px;
    padding:10px 22px;
    cursor:pointer;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .12s ease;
  }
  .next-btn.show{
    opacity:1;
    pointer-events:auto;
  }
  .next-btn:hover{transform:translateY(-2px);}

  .result{
    text-align:center;
    padding:40px 20px;
    display:none;
  }
  .result.show{display:block;}
  .result .score{
    font-family:'Kalam',cursive;
    font-size:4rem;
    color:var(--chalk-yellow);
    margin:0;
    line-height:1;
  }
  .result p{
    font-size:1.3rem;
    max-width:420px;
    margin:14px auto 26px;
  }
  .restart-btn{
    font-family:'Kalam',cursive;
    font-size:1.15rem;
    background:transparent;
    color:var(--chalk);
    border:2px solid var(--chalk);
    border-radius:8px;
    padding:10px 26px;
    cursor:pointer;
    font-weight:700;
  }
  .restart-btn:hover{background:rgba(255,255,255,0.06);}
  .quiz-area.hide{display:none;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="frame">
  <span class="eyebrow">Gramática · Verbo to be</span>
  <h1>¿Verdadero o falso?</h1>
  <p class="sub">10 frases con el verbo <em>to be</em>. Decidí si están bien usadas o no.</p>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span id="progressLabel">1 / 10</span>
  </div>

  <div class="quiz-area" id="quizArea">
    <div class="card">
      <span class="qnum" id="qnum">Pregunta 1</span>
      <p class="qtext" id="qtext"></p>
      <div class="options">
        <button class="opt-btn" id="btnTrue" onclick="answer(true)">Verdadero</button>
        <button class="opt-btn" id="btnFalse" onclick="answer(false)">Falso</button>
      </div>
      <p class="feedback" id="feedback"></p>
      <div class="nav-row">
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Siguiente →</button>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <p class="score" id="scoreText">0/10</p>
    <p id="resultMsg"></p>
    <button class="restart-btn" onclick="restart()">Intentar de nuevo</button>
  </div>
</div>

<script>
const questions = [
  { text: "I <em>is</em> a student.", answer: false, explain: "Con “I” se usa am: “I am a student.”" },
  { text: "She <em>is</em> my sister.", answer: true, explain: "Correcto: she + is." },
  { text: "They <em>is</em> happy.", answer: false, explain: "Con “they” se usa are: “They are happy.”" },
  { text: "We <em>are</em> friends.", answer: true, explain: "Correcto: we + are." },
  { text: "You <em>is</em> late.", answer: false, explain: "Con “you” se usa are: “You are late.”" },
  { text: "He <em>are</em> a doctor.", answer: false, explain: "Con “he” se usa is: “He is a doctor.”" },
  { text: "It <em>is</em> raining today.", answer: true, explain: "Correcto: it + is." },
  { text: "I <em>am</em> from Colombia.", answer: true, explain: "Correcto: I + am." },
  { text: "The cats <em>is</em> sleeping.", answer: false, explain: "Plural “cats” usa are: “The cats are sleeping.”" },
  { text: "You <em>am</em> my best friend.", answer: false, explain: "Con “you” se usa are: “You are my best friend.”" }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion(){
  const q = questions[current];
  document.getElementById('qnum').textContent = `Pregunta ${current+1}`;
  document.getElementById('qtext').innerHTML = q.text;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('show');
  const bT = document.getElementById('btnTrue');
  const bF = document.getElementById('btnFalse');
  [bT,bF].forEach(b=>{
    b.classList.remove('correct','wrong');
    b.disabled = false;
  });
  answered = false;
  updateProgress();
}

function updateProgress(){
  document.getElementById('progressLabel').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current/questions.length)*100}%`;
}

function answer(choice){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const correct = q.answer;
  const bT = document.getElementById('btnTrue');
  const bF = document.getElementById('btnFalse');
  const fb = document.getElementById('feedback');

  bT.disabled = true;
  bF.disabled = true;

  const chosenBtn = choice ? bT : bF;
  const correctBtn = correct ? bT : bF;

  if(choice === correct){
    chosenBtn.classList.add('correct');
    fb.textContent = '¡Correcto! ' + q.explain;
    fb.classList.add('ok');
    score++;
  } else {
    chosenBtn.classList.add('wrong');
    correctBtn.classList.add('correct');
    fb.textContent = 'No exactamente. ' + q.explain;
    fb.classList.add('no');
  }
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    showResult();
  } else {
    loadQuestion();
  }
}

function showResult(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = `${questions.length} / ${questions.length}`;
  document.getElementById('quizArea').classList.add('hide');
  document.getElementById('result').classList.add('show');
  document.getElementById('scoreText').textContent = `${score}/${questions.length}`;
  let msg;
  if(score === questions.length) msg = "¡Perfecto! Dominás am / is / are.";
  else if(score >= questions.length*0.7) msg = "Muy bien. Repasá los que fallaste y quedará perfecto.";
  else if(score >= questions.length*0.4) msg = "Vas por buen camino. Practicá un poco más con am / is / are.";
  else msg = "No te preocupes, es de práctica. Repasá la regla: I am, he/she/it is, you/we/they are.";
  document.getElementById('resultMsg').textContent = msg;
}

function restart(){
  current = 0;
  score = 0;
  document.getElementById('result').classList.remove('show');
  document.getElementById('quizArea').classList.remove('hide');
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
